<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Little Wash Crew - Level 1 Garage Preview</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="ui-overlay">
      <div class="hud-panel">
        <div class="hud-header">
          <h1>Little Wash Crew</h1>
          <span class="badge">Level 1: The Sedan Bay</span>
        </div>
        <p class="subtitle">Stylized Car Wash Simulation</p>

        <div class="camera-mode-card">
          <span class="mode-label">CURRENT CAMERA MODE:</span>
          <span id="current-view-text" class="mode-value">Third-Person (Over-the-Shoulder)</span>
        </div>

        <div class="controls-box">
          <button id="toggle-cam-btn" class="primary-btn">Switch to: First-Person View</button>
          <button id="orbit-inspect-btn" class="secondary-btn">Free Inspect Camera (Orbit)</button>
        </div>

        <div class="guide-box">
          <div class="guide-item">
            <span class="key">Third-Person:</span>
            <span>Frames crew member & spray gun behind car</span>
          </div>
          <div class="guide-item">
            <span class="key">First-Person:</span>
            <span>Eye-level view with handheld spray lance</span>
          </div>
          <div class="guide-item">
            <span class="key">Free Inspect:</span>
            <span>Left-click & drag mouse to rotate around bay</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
